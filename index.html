<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Employee Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Dark navy shades: page < panel < inset fields. Change these to re-theme everything. */
      :root { --bg: #0a0f1f; --panel: #111833; --inset: #0b1226; --line: #222d52; --ink: #e7ebf8; --muted: #8c97ba; --brand: #4a67e8; --brand-2: #8ea4ff; --danger: #ff7d6e; color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; }
      body { min-height: 100vh; font: 15px/1.5 "Plus Jakarta Sans", system-ui, sans-serif; color: var(--ink); background: radial-gradient(900px 500px at 85% -10%, #18214a, transparent 70%) no-repeat, var(--bg); }
      button, input, select { font: inherit; color: inherit; }
      :focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; }
      main { max-width: 1040px; margin: 0 auto; padding: 32px 20px 64px; }

      header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 24px; }
      h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
      header p { color: var(--muted); margin-top: 4px; }
      .top { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
      .me { color: var(--muted); font-weight: 500; }
      .badge { margin-left: 6px; padding: 2px 9px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; background: #1a2552; color: var(--brand-2); }

      .btn { border: 1px solid var(--line); background: #172044; padding: 9px 16px; border-radius: 10px; font-weight: 600; cursor: pointer; }
      .btn:hover:not(:disabled) { border-color: var(--brand-2); }
      .btn:disabled { opacity: 0.4; cursor: not-allowed; }
      .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
      .btn.primary:hover:not(:disabled) { background: #3b55cc; border-color: #3b55cc; }
      .btn.danger { color: var(--danger); }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }

      .stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-bottom: 20px; }
      .stats div { padding: 18px 22px; min-width: 0; }
      .stats div + div { border-left: 1px solid var(--line); }
      .stats b { display: block; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.02em; }
      .stats span { color: var(--muted); font-size: 0.85rem; }

      .profile { display: flex; align-items: center; flex-wrap: wrap; gap: 16px; padding: 22px; margin-bottom: 28px; }
      .profile .av { width: 56px; height: 56px; font-size: 1.1rem; }
      .profile h2 { font-size: 1.2rem; }
      .profile p { color: var(--muted); }
      .profile dl { display: flex; gap: 32px; margin-left: auto; }
      .profile dt { color: var(--muted); font-size: 0.85rem; }
      .profile dd { font-weight: 700; }
      .sub { font-size: 1.05rem; margin-bottom: 12px; }

      .toolbar { display: flex; gap: 12px; margin-bottom: 16px; }
      input, select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--inset); }
      input:focus, select:focus { border-color: var(--brand-2); outline: none; }
      .toolbar select { width: 220px; }

      table { width: 100%; border-collapse: collapse; }
      th { text-align: left; font-size: 0.8rem; font-weight: 600; color: var(--muted); padding: 14px 20px; border-bottom: 1px solid var(--line); }
      td { padding: 14px 20px; border-bottom: 1px solid var(--line); vertical-align: middle; }
      tr:last-child td { border-bottom: 0; }
      tbody tr:hover { background: #151e3d; }
      .who { display: flex; align-items: center; gap: 12px; }
      .who div { font-weight: 600; min-width: 0; }
      .who small { display: block; font-weight: 400; color: var(--muted); overflow-wrap: anywhere; }
      .av { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 0.85rem; background: hsl(var(--h) 50% 40%); color: #fff; }
      .chip { padding: 3px 11px; border-radius: 999px; font-size: 0.82rem; font-weight: 600; background: hsl(var(--h) 45% 20%); color: hsl(var(--h) 85% 82%); }
      .acts { text-align: right; white-space: nowrap; }
      .acts .btn { padding: 6px 12px; margin-left: 6px; }
      .empty { text-align: center; color: var(--muted); padding: 48px 20px; }
      .error { background: #3a1620; border: 1px solid #5c2430; color: #ffb4aa; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; font-weight: 500; }

      .overlay { position: fixed; inset: 0; background: rgba(3, 6, 16, 0.7); display: grid; place-items: center; padding: 16px; z-index: 10; }
      .modal { width: min(460px, 100%); max-height: 100%; overflow: auto; padding: 24px; }
      .modal h2 { font-size: 1.25rem; margin-bottom: 16px; }
      label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 12px; }
      label input, label select { margin-top: 5px; font-weight: 400; }
      .row { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

      .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
      .login form { width: min(400px, 100%); padding: 28px; }
      .login h1 { font-size: 1.6rem; }
      .login h1 + p { color: var(--muted); margin: 4px 0 20px; }
      .login .btn { width: 100%; margin-top: 6px; padding: 11px; }
      .link { display: block; width: 100%; margin-top: 16px; border: 0; background: none; color: var(--brand-2); font-weight: 600; cursor: pointer; }
      .link:hover { text-decoration: underline; }
      .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin-bottom: 20px; background: var(--inset); border: 1px solid var(--line); border-radius: 12px; }
      .tabs button { border: 0; background: none; padding: 9px; border-radius: 9px; font-weight: 600; color: var(--muted); cursor: pointer; }
      .tabs .on { background: var(--brand); color: #fff; }

      @media (max-width: 720px) {
        main { padding: 24px 16px 48px; }
        header { flex-direction: column; align-items: flex-start; }
        .stats div { padding: 14px; }
        .stats b { font-size: 1.2rem; }
        .profile dl { margin-left: 0; width: 100%; flex-wrap: wrap; gap: 14px 28px; }
        .toolbar { flex-direction: column; }
        .toolbar select { width: 100%; }
        thead { display: none; }
        tr { display: block; padding: 14px 16px; border-bottom: 1px solid var(--line); }
        tr:last-child { border-bottom: 0; }
        td { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 6px 0; border: 0; }
        td[data-label]::before { content: attr(data-label); color: var(--muted); font-size: 0.85rem; }
        .acts { justify-content: flex-end; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/App.jsx"></script>
  </body>
</html>
